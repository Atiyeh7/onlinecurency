<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Prints</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: #EEEEEE;
            font-family: 'BNMagnique', sans-serif;
            padding: 20px 0 20px 0;
        }

        .prints-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 95%;
            margin: 40px auto;
        }

        .prints-container img {
            width: 31%;
            margin: 1%;
            height: auto;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .prints-container img:hover {
            transform: scale(1.05);
        }

        /* Lightbox Modal */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 10000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            justify-content: center;
            align-items: center;
        }

        .lightbox-content {
            max-width: 90%;
            max-height: 90%;
        }

        .lightbox-content img {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 40px;
            font-size: 40px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            z-index: 10001;
        }

        .lightbox-close:hover {
            color: #ccc;
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 60px;
            color: white;
            cursor: pointer;
            user-select: none;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
        }

        .lightbox-nav:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        .lightbox-prev {
            left: 20px;
        }

        .lightbox-next {
            right: 20px;
        }

        @media (max-width: 768px) {
            .prints-container img {
                width: 90%;
                margin: 10px auto;
                display: block;
            }
        }
    </style>
</head>

    </div>

    <div style="max-width: 80%; margin: 40px auto; padding: 0 20px;">
        <div style="border-top: 1px solid #000000; padding-top: 15px;">
            <div onclick="toggleDescription()" style="cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid #000000; font-family: 'BNMagnique', sans-serif;">
                <span style="font-size: 14px; font-weight: normal; color: #000000;">Description</span>
                <span id="toggleIcon" style="font-size: 20px; color: #000000;">+</span>
            </div>
            <div id="descriptionContent" style="display: none; padding-top: 20px; font-family: 'BNMagnique', sans-serif;">
                <p style="font-size: 16px; line-height: 1.6; color: #000000; text-align: left; margin-bottom: 15px;">Description for screen prints goes here.</p>
            </div>
        </div>
    </div>

    <button class="back-btn" onclick="window.location.href='portfolio.html'">Back</button>

    <!-- Lightbox Modal -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        <span class="lightbox-nav lightbox-prev" onclick="changeImage(-1)">&#10094;</span>
        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="Full size image">
        </div>
        <span class="lightbox-nav lightbox-next" onclick="changeImage(1)">&#10095;</span>
    </div>

    <script>
        function toggleDescription() {
            const content = document.getElementById('descriptionContent');
            const icon = document.getElementById('toggleIcon');
            if (content.style.display === 'none') {
                content.style.display = 'block';
                icon.textContent = '−';
            } else {
                content.style.display = 'none';
                icon.textContent = '+';
            }
        }

        // Lightbox functionality
        let currentLightboxIndex = 0;
        const lightboxImages = [
            'https://www.dropbox.com/scl/fi/l1gl1xy0hdn39g1nb00sx/Photoroom_20240823_172324.JPG?rlkey=m2hc8wnyzll3o26xvqnywm8st&st=c09qvbl5&dl=1',
            'https://www.dropbox.com/scl/fi/xqk6so21d3w0qrf6glynw/Photoroom_20240813_220443.JPG?rlkey=6pidlc98zd1219qvejy7d25m7&st=b90n3bfa&dl=1',
            'https://www.dropbox.com/scl/fi/qp6k7iyzlzaln4ds7w77s/Photoroom_009_20240908_140604.JPG?rlkey=85bwqxphx3b633l81ipic287v&st=lhfh9mvh&dl=1',
            'https://www.dropbox.com/scl/fi/mox4u5exnizw24iv9co2d/Photoroom_007_20240827_133450.JPG?rlkey=s0hbi2ogdlb7b3xuuuasrctao&st=ao7xaaya&dl=1',
            'https://www.dropbox.com/scl/fi/ivio5jy7tu3edsdmsefjs/Photoroom_004_20240824_162311.JPG?rlkey=u202wpergkb2td71ok1fxzzf1&st=vyvwwr1m&dl=1',
            'https://www.dropbox.com/scl/fi/9zizu6x0s59g50o6q2tvm/Photoroom_003_20240906_124854.JPG?rlkey=9o3aurjfap0nqomny1qybsiny&st=ougajfa8&dl=1',
            'https://www.dropbox.com/scl/fi/s9ogwhtzhcb46e28kdvgr/IMG_0084-Photoroom.jpeg?rlkey=kwls6xmv54y2vea28uo4ci7kh&st=0oetxqz1&dl=1',
            'https://www.dropbox.com/scl/fi/rbrlop0xcx4u1ej3uy56e/IMG_0090-Photoroom.jpeg?rlkey=4136uifm1htnlglpw787008l0&st=ztlbghtt&dl=1',
            'https://www.dropbox.com/scl/fi/c6ukqstippjqm95v0r9se/IMG_0137-Photoroom.jpeg?rlkey=e2dzck51gjx7kprd8rzhjnklw&st=430h1df4&dl=1',
            'https://www.dropbox.com/scl/fi/1dhpgwqbb7f4sv96y4uid/IMG_0155-Photoroom.jpeg?rlkey=eclgedb2saoivwo61axjaaiu7&st=nqqwh621&dl=1',
            'https://www.dropbox.com/scl/fi/bxdo03vjhtqmh1wfvkpec/IMG_0192-Photoroom.jpeg?rlkey=brk0dhgxre5mt915jqhe4wnl0&st=gx9jh4hg&dl=1',
            'https://www.dropbox.com/scl/fi/e22oh4hm0byztk0zhandq/IMG_0202-Photoroom.jpeg?rlkey=u5knpn7a6m4u9x8o0aqc7lbx4&st=ukbr9qn4&dl=1',
            'https://www.dropbox.com/scl/fi/9xzbaxgqigynumu6j8e5e/IMG_0700-Photoroom.jpeg?rlkey=o49sra9v2w1qhr5xamh3fakgn&st=rdgfsu9g&dl=1',
            'https://www.dropbox.com/scl/fi/7wzk4fyojpt223i5k9x0z/IMG_0706-Photoroom.jpeg?rlkey=nnue9w4jhkadz7ikt5x2lc1ul&st=x8njt3yr&dl=1',
            'https://www.dropbox.com/scl/fi/guqni81wnejoqqqvppsot/IMG_0724-Photoroom.jpeg?rlkey=bvjv84mwcfdc8no978frlpiv5&st=dy3pvsx4&dl=1',
            'https://www.dropbox.com/scl/fi/hjzntyoggdpmb84scy8sl/IMG_0732-Photoroom.jpeg?rlkey=mi7w0wcpvay4z7fro5a46vfmq&st=lg95q62d&dl=1',
            'https://www.dropbox.com/scl/fi/19e5pxkkid0y18dlyigm4/IMG_0734-Photoroom.jpeg?rlkey=74mibqdu87qc6wygklgiupnd6&st=mjy8jz3a&dl=1',
            'https://www.dropbox.com/scl/fi/f9rzg4uas3m3xopqbml2f/IMG_0736-Photoroom.jpeg?rlkey=pdng96svfphpph4i5kwirt3oo&st=xf9a60fx&dl=1',
            'https://www.dropbox.com/scl/fi/yaclweyoo05y46z5k3gpd/IMG_0738-Photoroom.jpeg?rlkey=adrsbhksklrhgl4558klu2w4k&st=9sof1i41&dl=1',
            'https://www.dropbox.com/scl/fi/hqf367fm5j8wdceq8w0fb/IMG_0742-Photoroom.jpeg?rlkey=dpqvykt55pnjnrh8dekqmukr6&st=6myzv0kv&dl=1',
            'https://www.dropbox.com/scl/fi/x9k2o5zy1gvy26722ugdv/IMG_6852-Photoroom.jpeg?rlkey=24w5savgd92ecezdmdkjnrx9a&st=4yg2k6ap&dl=1',
            'https://www.dropbox.com/scl/fi/36fqir7w1csyp3hiinj95/IMG_6865-Photoroom.jpeg?rlkey=vfftx3633ex96yu99yei7qfg4&st=4yzttgz5&dl=1',
            'https://www.dropbox.com/scl/fi/hjeumvcczuae3vw0yxnct/IMG_6895-Photoroom.jpeg?rlkey=kr1wzxhdpiofwq75opcwiutih&st=75p6qsde&dl=1'
        ];

        function openLightbox(index) {
            currentLightboxIndex = index;
            document.getElementById('lightbox').style.display = 'flex';
            document.getElementById('lightbox-img').src = lightboxImages[currentLightboxIndex];
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        function changeImage(direction) {
            currentLightboxIndex += direction;
            if (currentLightboxIndex < 0) {
                currentLightboxIndex = lightboxImages.length - 1;
            } else if (currentLightboxIndex >= lightboxImages.length) {
                currentLightboxIndex = 0;
            }
            document.getElementById('lightbox-img').src = lightboxImages[currentLightboxIndex];
        }

        // Close lightbox when clicking on background
        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target === this) {
                closeLightbox();
            }
        });

        // Keyboard navigation
        document.addEventListener('keydown', function(event) {
            const lightbox = document.getElementById('lightbox');
            if (lightbox.style.display === 'flex') {
                if (event.key === 'ArrowLeft') {
                    changeImage(-1);
                } else if (event.key === 'ArrowRight') {
                    changeImage(1);
                } else if (event.key === 'Escape') {
                    closeLightbox();
                }
            }
        });
    </script>
</body>
